<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSVP Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<style>
  .wrap { max-width: 1100px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 22px 0; flex-wrap: wrap; }
  .top h1 { font-size: 32px; }
  .top .who { font-size: 13px; color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .stat { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .stat .n { font-family: var(--serif); font-size: 34px; line-height: 1; }
  .stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; margin-top: 6px; }
  .stat.hl { border-color: var(--accent); background: rgba(138,154,123,.08); }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 18px; }
  .panel h2 { font-size: 24px; margin-bottom: 12px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tab { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 7px 14px; cursor: pointer; font: 14px var(--sans); }
  .tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar input { flex: 1; min-width: 180px; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td .sub { color: var(--muted); font-size: 13px; }
  .chip { display: inline-block; font-size: 12px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .chip.yes { background: #e5eddf; color: #46573b; }
  .chip.no { background: #f4e1de; color: #8e3d34; }
  .chip.pending { background: #f3ecdd; color: #84693a; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .mini { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px; padding: 5px 9px; font: 13px var(--sans); cursor: pointer; white-space: nowrap; }
  .mini:hover { border-color: var(--accent); }
  .mini.danger { color: var(--danger); }
  .formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .inline-checks { display: flex; gap: 16px; flex-wrap: wrap; margin: 6px 0 12px; font-size: 15px; }
  .inline-checks label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .list { margin: 0; padding: 0; list-style: none; }
  .list li { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .list li b { font-weight: 500; }
  .login { max-width: 420px; margin: 12vh auto; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 9; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 700px) { .formgrid, .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- Login -->
  <section id="login" class="card login hidden">
    <h2>RSVP admin</h2>
    <p class="lead" id="loginLead">Enter your email and we'll send you a sign-in link.</p>
    <div class="field"><input type="email" id="email" placeholder="you@example.com" autocomplete="email"></div>
    <button class="btn" id="loginBtn">Email me a sign-in link</button>
    <div class="error hidden" id="loginMsg"></div>
  </section>

  <!-- Dashboard -->
  <section id="app" class="hidden">
    <div class="top">
      <div><h1 id="title">Guest list</h1><div class="who" id="who"></div></div>
      <div class="actions">
        <button class="mini" id="copyLinkBtn">Copy RSVP link</button>
        <button class="mini" id="waBtn">Share on WhatsApp</button>
        <button class="mini" id="refreshBtn">Refresh</button>
        <button class="mini" id="csvBtn">Export CSV</button>
        <button class="mini" id="logoutBtn">Sign out</button>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="panel">
      <div class="tabs" id="tabs">
        <button class="tab on" data-f="all">All</button>
        <button class="tab" data-f="yes">Attending</button>
        <button class="tab" data-f="no">Declined</button>
      </div>
      <div class="toolbar"><input type="text" id="search" placeholder="Search names or numbers…"></div>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Name</th><th>Status</th><th>Adults</th><th>Kids</th><th>Dietary</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <div class="grid2">
      <div class="panel"><h2>Dietary &amp; allergies</h2><ul class="list" id="dietList"></ul></div>
      <div class="panel"><h2>Song requests</h2><ul class="list" id="songList"></ul></div>
    </div>
    <div class="panel"><h2>Messages</h2><ul class="list" id="msgList"></ul></div>
  </section>
</div>
<div class="demo-tag hidden" id="demoTag">Demo mode</div>

<script>
const W = window.WEDDING;
const DEMO = !W.supabaseUrl || !W.supabaseKey;
const $ = id => document.getElementById(id);
let sb = null, rsvps = [], filter = 'all';

// ---------- demo data ----------
let DEMO_DATA = [
  { id: '1', name: 'Thabo Mokoena', phone: '082 123 4567', attending: true, adults: 2, adult_names: 'Lerato Mokoena', bringing_kids: true, kids_under_10: 1, kids_10_plus: 1, kids_names: 'Mia (6), Leo (12)', dietary: 'Leo has a nut allergy', song_request: 'September — Earth, Wind & Fire', message: 'So happy for you both!', updated_at: '2026-11-05T10:00:00Z' },
  { id: '2', name: 'Johan Botha', phone: '083 555 1212', attending: false, adults: 0, message: "Sorry to miss it — I'll be overseas.", updated_at: '2026-11-07T10:00:00Z' },
  { id: '3', name: 'Priya Naidoo', phone: '071 222 3333', attending: true, adults: 2, adult_names: 'Kevin Naidoo', bringing_kids: true, kids_under_10: 2, kids_10_plus: 0, kids_names: 'Anya (4), Dev (7)', dietary: 'Priya — vegetarian', song_request: 'Jerusalema', updated_at: '2026-11-08T10:00:00Z' },
];

// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rsvpLink = () => `${location.origin}${location.pathname.replace(/admin\.html$/, '')}`;
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

function loadSupabase() {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js';
    s.onload = () => resolve(window.supabase.createClient(W.supabaseUrl, W.supabaseKey));
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

// ---------- data ----------
async function fetchAll() {
  if (DEMO) { rsvps = structuredClone(DEMO_DATA); return render(); }
  const { data, error } = await sb.from('public_rsvps').select('*').order('name');
  if (error) { console.error(error); return toast('Could not load RSVPs'); }
  rsvps = data; render();
}

async function deleteRsvp(id, name) {
  if (!confirm(`Delete the RSVP from ${name}? This can't be undone.`)) return;
  if (DEMO) DEMO_DATA = DEMO_DATA.filter(r => r.id !== id);
  else { const { error } = await sb.from('public_rsvps').delete().eq('id', id); if (error) return toast(error.message); }
  toast('Deleted'); fetchAll();
}

// ---------- render ----------
function render() {
  $('title').textContent = `${W.couple} — guest list`;
  let adults = 0, under = 0, over = 0, yes = 0, no = 0;
  rsvps.forEach(r => {
    if (r.attending) { yes++; adults += r.adults || 0; under += r.kids_under_10 || 0; over += r.kids_10_plus || 0; }
    else no++;
  });
  const stat = (n, l, hl) => `<div class="stat${hl ? ' hl' : ''}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  $('stats').innerHTML =
    stat(adults + under + over, 'Total guests coming', true) +
    stat(adults, 'Adults') + stat(under, 'Kids under 10') + stat(over, 'Kids 10+') +
    stat(rsvps.length, 'Responses') + stat(no, 'Declined');

  const q = $('search').value.trim().toLowerCase();
  const shown = rsvps.filter(r => (filter === 'all' || (filter === 'yes') === r.attending) &&
    (!q || [r.name, r.phone, r.adult_names, r.kids_names].join(' ').toLowerCase().includes(q)));

  $('rows').innerHTML = shown.map(r => {
    const chip = r.attending ? '<span class="chip yes">Attending</span>' : '<span class="chip no">Declined</span>';
    const date = new Date(r.updated_at).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' });
    const adultsCell = r.attending ? `${r.adults}${r.adult_names ? `<div class="sub">+ ${esc(r.adult_names)}</div>` : ''}` : '';
    const kids = r.attending && r.bringing_kids ? `${r.kids_under_10} under 10, ${r.kids_10_plus} 10+<div class="sub">${esc(r.kids_names)}</div>` : '';
    const tel = esc((r.phone || '').replace(/[^\d+]/g, ''));
    return `<tr>
      <td><b>${esc(r.name)}</b><div class="sub"><a href="tel:${tel}">${esc(r.phone)}</a></div></td>
      <td>${chip}<div class="sub">${date}</div></td>
      <td>${adultsCell}</td>
      <td>${kids}</td>
      <td class="sub">${esc(r.dietary || '')}</td>
      <td><button class="mini danger" data-del="${r.id}">Delete</button></td>
    </tr>`;
  }).join('') || `<tr><td colspan="6" class="sub" style="padding:20px">No RSVPs yet — share your link!</td></tr>`;

  const yesR = rsvps.filter(r => r.attending);
  const li = (who, txt) => `<li><b>${esc(who)}</b> — ${esc(txt)}</li>`;
  $('dietList').innerHTML = yesR.filter(r => r.dietary).map(r => li(r.name, r.dietary)).join('') || '<li class="hint">None yet</li>';
  $('songList').innerHTML = yesR.filter(r => r.song_request).map(r => li(r.name, r.song_request)).join('') || '<li class="hint">None yet</li>';
  $('msgList').innerHTML = rsvps.filter(r => r.message).map(r => li(r.name, r.message)).join('') || '<li class="hint">None yet</li>';
}

// ---------- events ----------
$('tabs').onclick = e => { const b = e.target.closest('.tab'); if (!b) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === b)); filter = b.dataset.f; render(); };
$('search').oninput = render;
$('refreshBtn').onclick = fetchAll;
$('rows').onclick = e => { const b = e.target.closest('button[data-del]'); if (!b) return;
  const r = rsvps.find(x => x.id === b.dataset.del); deleteRsvp(r.id, r.name); };

$('copyLinkBtn').onclick = async () => { await navigator.clipboard.writeText(rsvpLink()); toast('RSVP link copied'); };
$('waBtn').onclick = () => {
  const text = `You're invited to celebrate with ${W.couple} on ${W.dateDisplay}! Please RSVP by ${W.rsvpDeadlineDisplay}: ${rsvpLink()}`;
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
};

$('csvBtn').onclick = () => {
  const head = ['Name','Phone','Status','Adults','Other adults','Kids under 10','Kids 10+','Kids names','Dietary','Song','Message','Replied'];
  const lines = rsvps.map(r => [r.name, r.phone, r.attending ? 'Attending' : 'Declined', r.adults, r.adult_names,
    r.kids_under_10 || 0, r.kids_10_plus || 0, r.kids_names, r.dietary, r.song_request, r.message, (r.updated_at || '').slice(0, 10)]);
  const csv = [head, ...lines].map(row => row.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
  a.download = `rsvps-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
};

// ---------- auth ----------
$('loginBtn').onclick = async () => {
  const email = $('email').value.trim(); if (!email) return;
  $('loginBtn').disabled = true;
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
  $('loginBtn').disabled = false;
  $('loginMsg').classList.remove('hidden');
  $('loginMsg').style.color = error ? '' : 'var(--accent-dark)';
  $('loginMsg').textContent = error ? error.message : 'Check your inbox for the sign-in link.';
};
$('logoutBtn').onclick = async () => { if (!DEMO) await sb.auth.signOut(); location.reload(); };

(async () => {
  if (DEMO) {
    $('demoTag').classList.remove('hidden'); $('who').textContent = 'Demo mode — sample data, nothing is saved';
    $('app').classList.remove('hidden'); return fetchAll();
  }
  sb = await loadSupabase();
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return $('login').classList.remove('hidden');
  const { data: ok } = await sb.rpc('is_admin');
  if (!ok) {
    $('login').classList.remove('hidden');
    $('loginLead').textContent = `${session.user.email} isn't on the admin list. Add it to the admins table in Supabase, or sign in with another email.`;
    await sb.auth.signOut(); return;
  }
  $('who').textContent = `Signed in as ${session.user.email}`;
  $('app').classList.remove('hidden');
  fetchAll();
})();
</script>
</body>
</html>
